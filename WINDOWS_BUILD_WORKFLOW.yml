name: Build Windows VST3 Plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure project
        run: >
          cmake
          -S .
          -B build
          -A x64
          -DPSYCLE_FETCH_VST3_SDK=ON

      - name: Build Release plugins
        run: cmake --build build --config Release --parallel

      - name: Upload Windows VST3 plugins
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-US-Psycle-VST3-Windows-x64
          if-no-files-found: error
          path: |
            build/VST3/Release/PsycleSynthLoader.vst3
            build/VST3/Release/PsycleEffectLoader.vst3